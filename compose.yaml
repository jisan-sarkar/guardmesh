name: guardmesh

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-guardmesh}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - guardmesh-postgres:/var/lib/postgresql/data
      - ./packages/guardmesh-orders-service/migrations/001_create_orders.sql:/docker-entrypoint-initdb.d/10-orders.sql:ro
      - ./packages/guardmesh-inventory-service/migrations/001_create_inventory.sql:/docker-entrypoint-initdb.d/20-inventory.sql:ro
      - ./packages/guardmesh-security-service/migrations/001_create_security.sql:/docker-entrypoint-initdb.d/30-security.sql:ro
      - ./infra/postgres/40_seed.sql:/docker-entrypoint-initdb.d/40-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: [guardmesh-rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-local-only}
    volumes:
      - ./infra/keycloak/guardmesh-realm.json:/opt/keycloak/data/import/guardmesh-realm.json:ro
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]

  opa:
    image: openpolicyagent/opa:1.22.2
    command: ["run", "--server", "--addr", ":8181", "/policies"]
    volumes:
      - ./packages/guardmesh-policy/policy:/policies:ro
    ports: ["${OPA_PORT:-8181}:8181"]

  orders-api:
    build:
      context: .
      dockerfile: infra/docker/node-app.Dockerfile
    command: ["pnpm", "--filter", "@guardmesh/orders-api", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPA_POLICY_URL: ${OPA_POLICY_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      ACTOR_DIRECTORY_JSON: ${ACTOR_DIRECTORY_JSON}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      opa: {condition: service_started}
      keycloak: {condition: service_started}

  inventory-api:
    build:
      context: .
      dockerfile: infra/docker/node-app.Dockerfile
    command: ["pnpm", "--filter", "@guardmesh/inventory-api", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPA_POLICY_URL: ${OPA_POLICY_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      ACTOR_DIRECTORY_JSON: ${ACTOR_DIRECTORY_JSON}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      opa: {condition: service_started}
      keycloak: {condition: service_started}

  security-api:
    build:
      context: .
      dockerfile: infra/docker/node-app.Dockerfile
    command: ["pnpm", "--filter", "@guardmesh/security-api", "start"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      ACTOR_DIRECTORY_JSON: ${ACTOR_DIRECTORY_JSON}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_started}

  demo-web:
    build:
      context: .
      dockerfile: infra/docker/node-app.Dockerfile
    command: ["pnpm", "--filter", "@guardmesh/demo-web", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_OIDC_ISSUER: ${OIDC_ISSUER}
      VITE_OIDC_CLIENT_ID: demo-web
    depends_on: [orders-api, inventory-api, security-api]

  traefik:
    image: traefik:v3.3
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports: ["${TRAEFIK_PORT:-80}:80"]
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on: [demo-web, orders-api, inventory-api, security-api]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector:0.115.1
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    ports: ["${GRAFANA_PORT:-3003}:3000"]
    volumes:
      - ./infra/observability/grafana-dashboard.json:/var/lib/grafana/dashboards/guardmesh.json:ro

volumes:
  guardmesh-postgres:
  guardmesh-rabbitmq:
