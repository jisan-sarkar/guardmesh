name: GuardMesh CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Install OPA
        run: |
          curl -fsSL https://openpolicyagent.org/downloads/v1.22.2/opa_linux_amd64_static -o /tmp/guardmesh-opa
          chmod 700 /tmp/guardmesh-opa
      - run: pnpm policy:test
      - run: git diff --check
      - run: pnpm audit --audit-level high

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config
      - run: docker compose --profile observability --env-file .env.example config

  runtime-smoke:
    runs-on: ubuntu-latest
    needs: [verify, compose-config]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Start isolated stack
        run: >-
          POSTGRES_PORT=15432
          RABBITMQ_PORT=15672
          RABBITMQ_MANAGEMENT_PORT=25672
          KEYCLOAK_PORT=18081
          OPA_PORT=18181
          TRAEFIK_PORT=18080
          ENABLE_API_DOCS=true
          docker compose -p guardmesh-ci --env-file .env.example up -d --build
      - name: Run end-to-end runtime smoke
        run: >-
          BASE_URL=http://127.0.0.1:18080
          POSTGRES_CONTAINER=guardmesh-ci-postgres-1
          RABBITMQ_CONTAINER=guardmesh-ci-rabbitmq-1
          scripts/runtime-smoke.sh
      - name: Validate generated OpenAPI contracts
        run: BASE_URL=http://127.0.0.1:18080 scripts/openapi-smoke.sh
      - name: Tear down isolated stack
        if: always()
        run: docker compose -p guardmesh-ci --env-file .env.example down -v
